<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор итоговой оценки</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-buttons">
            <div class="mode-dropdown">
                <button id="mode-toggle" class="nav-button">Сменить режим</button>
                <div class="mode-dropdown-content" id="modeDropdown">
                    <div class="mode-option" data-mode="serious">Серьёзный режим</div>
                    <div class="mode-option" data-mode="standard">Стандартный режим</div>
                    <div class="mode-option" data-mode="evil">Злой старшекурсник</div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>📚 Калькулятор оценок</h1>
        <div class="current-mode" id="currentModeDisplay">Текущий режим: Стандартный</div>

        <div class="input-group">
            <label for="regmid">РегМид (0-100)</label>
            <input type="number" id="regmid" min="0" max="100" placeholder="Введите оценку">
        </div>

        <div class="input-group">
            <label for="regend">РегЭнд (0-100)</label>
            <input type="number" id="regend" min="0" max="100" placeholder="Введите оценку">
        </div>

        <div class="input-group">
            <label for="final">Файнал (0-100)</label>
            <input type="number" id="final" min="0" max="100" placeholder="Оставьте пустым для прогноза">
        </div>

        <button onclick="calculate()">Рассчитать</button>

        <div class="warning-text">
            ⚠️ <strong>Важно:</strong> Списывание ведёт к отчислению!
        </div>

        <div id="result" class="result"></div>
    </div>

    <footer>
        &copy; 2025 Not_404. In case of any bug contact via Telegram <a href="https://t.me/Qrudos"
            target="_blank">@Qrudos</a>.
    </footer>
    <script src="commands.js"></script>

</body>

</html>
