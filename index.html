<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор итоговой оценки</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="modeModal">
        <div class="modal-content">
            <h3>🎭 Выберите режим работы</h3>
            <select id="modeSelect" onchange="updateDescription()">
                <option value="serious">Серьёзный режим</option>
                <option value="standard" selected>Стандартный режим</option>
                <option value="evil">Злой старшекурсник</option>
            </select>
            <div class="mode-description" id="modeDescription">
                Обычный калькулятор без лишних комментариев. Просто факты и результаты.
            </div>
            <button onclick="startApp()">Начать</button>
        </div>
    </div>

    <div id="modeMenu">
        <label for="modeChange">Режим:</label>
        <select id="modeChange" onchange="changeMode(this.value)">
            <option value="serious">Серьёзный</option>
            <option value="standard">Стандартный</option>
            <option value="evil">Злой старшекурсник</option>
        </select>
    </div>

    <div class="container">
        <h1>📚 Калькулятор оценок</h1>

        <div class="input-group">
            <label for="regmid">РегМид (0-100)</label>
            <input type="number" id="regmid" min="0" max="100" placeholder="Введите оценку">
        </div>

        <div class="input-group">
            <label for="regend">РегЭнд (0-100)</label>
            <input type="number" id="regend" min="0" max="100" placeholder="Введите оценку">
        </div>

        <div class="input-group">
            <label for="final">Файнал (0-100)</label>
            <input type="number" id="final" min="0" max="100" placeholder="Оставьте пустым для прогноза">
        </div>

        <button onclick="calculate()">Рассчитать</button>

        <div class="warning-text">
            ⚠️ <strong>Важно:</strong> Списывание ведёт к отчислению!
        </div>

        <div id="result" class="result"></div>
    </div>
    <script src="commands.js"></script>
</body>

</html>
