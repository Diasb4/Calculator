<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор оценок - Шаблоны</title>
    <link rel="stylesheet" href="../style/styleForTempl.css">
</head>

<body>
    <nav class="navbar">
        <a href="../index.html" class="nav-button">← На главную</a>
    </nav>

    <div class="main-container">
        <!-- Боковая панель с выбором шаблона -->
        <div class="template-sidebar">
            <h2>🎯 Выбор шаблона</h2>

            <div class="input-group">
                <label for="course">Курс</label>
                <select id="course" onchange="updatePrograms()">
                    <option value="">Выберите курс</option>
                    <option value="1">1 курс</option>
                    <option value="2">2 курс</option>
                    <option value="3">3 курс</option>
                    <option value="master">Магистратура</option>
                </select>
            </div>

            <div class="input-group">
                <label for="program">Образовательная программа</label>
                <select id="program" onchange="updateSubjects()" disabled>
                    <option value="">Сначала выберите курс</option>
                </select>
            </div>

            <div class="input-group">
                <label for="subject">Предмет</label>
                <select id="subject" onchange="loadTemplate()" disabled>
                    <option value="">Сначала выберите программу</option>
                </select>
            </div>

            <div class="template-info" id="templateInfo" style="display: none;">
                <h4>📊 Структура оценок</h4>
                <ul class="weight-list" id="weightList">
                    <!-- Динамически заполняется -->
                </ul>
            </div>
        </div>

        <!-- Основной калькулятор -->
        <div class="calculator">
            <h1>📚 Калькулятор оценок</h1>
            <div class="current-template" id="currentTemplate">Выберите шаблон для начала работы</div>

            <div id="inputFields">
                <!-- Поля ввода будут добавляться динамически -->
                <div style="text-align: center; color: #666; padding: 40px;">
                    Выберите предмет в боковой панели чтобы начать расчет
                </div>
            </div>

            <div class="button-group" id="buttonGroup" style="display: none;">
                <button onclick="calculateMid()" id="calculateMidBtn">Рассчитать РегМид</button>
                <button onclick="calculateEnd()" id="calculateEndBtn">Рассчитать РегЭнд</button>
                <button onclick="calculateBoth()" class="calculate-both">Рассчитать оба</button>
            </div>

            <div class="warning-text">
                ⚠️ <strong>Важно:</strong> Списывание ведёт к отчислению!
            </div>

            <div id="result" class="result"></div>
        </div>
    </div>

    <footer>
        &copy; 2025 Not_404. In case of any bug contact via Telegram <a href="https://t.me/Qrudos"
            target="_blank">@Qrudos</a>.
    </footer>

    <script src="../js/template.js"></script>
</body>

</html>
