<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradeMaster - Обратная связь</title>
    <link rel="stylesheet" href="../style/styleForFeedback.css">
</head>

<body>
    <!-- Navigation bar -->
    <nav class="navbar">
    <a href="../index.html" class="nav-button" data-translate="nav_home">← Home</a>
    <div class="nav-buttons">
        <button id="language-toggle" class="nav-button">🌐 English</button>
        <button id="theme-toggle" class="nav-button" data-translate="nav_theme">🌙 Theme</button>
    </div>
</nav>

    <!-- Feedback container -->
    <div class="feedback-container">
        <h1 data-translate="option_feedback_title">💬 Feedback</h1>
        <p class="subtitle">
            Have ideas to improve the calculator? Found a bug?<br>
            Напишите нам - мы ценим ваше мнение!
        </p>

        <form class="feedback-form" id="feedbackForm">
            <div class="form-group">
                <label for="userName">Ваше имя (необязательно):</label>
                <input type="text" id="userName" placeholder="Как к вам обращаться?">
            </div>

            <div class="form-group">
                <label for="feedbackType">Тип обращения:</label>
                <select id="feedbackType">
                    <option value="suggestion">💡 Предложение по улучшению</option>
                    <option value="bug">🐛 Сообщение об ошибке</option>
                    <option value="feature">🚀 Запрос новой функции</option>
                    <option value="other">📝 Другое</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Сообщение:*</label>
                <textarea id="message" placeholder="Опишите вашу идею, проблему или предложение..." required></textarea>
            </div>

            <div class="form-group">
                <label for="contact">Контакт (если нужен ответ):</label>
                <input type="text" id="contact" placeholder="Telegram, email или др.">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                📨 Отправить сообщение
            </button>
        </form>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script src="../js/language.js"></script>
    <script src="../js/feedback.js">

    </script>
</body>

</html>
