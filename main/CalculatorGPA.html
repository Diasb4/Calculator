<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0">
    <title>GPA Calculator - GradeMaster</title>
    <link rel="stylesheet" href="../style/styleForGPA.css">
</head>

<body>
    <nav class="navbar">
        <a href="../index.html" class="nav-button">← На главную</a>
        <div class="nav-buttons">
            <button id="theme-toggle" class="nav-button">🌙 Тема</button>
        </div>
    </nav>

    <div class="container">
        <h1>📊 GPA Calculator</h1>
        <div class="current-mode">Расчет средневзвешенного GPA с учетом кредитов</div>

        <div class="formula">
            GPA = Σ(GPA<sub>предмета</sub> × кредиты) / Σ(кредиты)
        </div>

        <div class="input-group">
            <label for="subjects-count">Количество предметов:</label>
            <input type="number" id="subjects-count" min="1" max="20" value="6">
        </div>

        <button id="generate-subjects" class="calculate-btn">Сгенерировать форму для предметов</button>

        <div id="subjects-container"></div>

        <button id="calculate-gpa" class="calculate-btn" style="display: none;">Рассчитать GPA</button>

        <div class="warning-text">
            ⚠️ <strong>Важно:</strong> Введите корректные данные для всех предметов!
        </div>

        <div id="result" class="result"></div>
    </div>

    <footer>
        &copy; 2025 Not_404. In case of any bug contact via Telegram <a href="https://t.me/Qrudos"
            target="_blank">@Qrudos</a>.
    </footer>

    <script src="../js/gpa.js"></script>
</body>

</html>
