<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0">
    <meta name="theme-color" content="#090d16">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../icons/icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../icons/icon-192.svg">
    <link rel="stylesheet" href="../style/styleForGPA.css">
    <link rel="stylesheet" href="../style/navbarResponsive.css">
</head>

<body>
    <nav class="navbar">
    <a href="../index.html" class="nav-button" data-translate="nav_home">← Home</a>
    <div class="nav-buttons">
        <select id="language-toggle" class="nav-button" aria-label="Язык"><option value="ru" lang="ru">Русский</option><option value="kk" lang="kk">Қазақша</option><option value="en" lang="en">English</option></select>
        <button id="theme-toggle" class="nav-button" data-translate="nav_theme">🌙 Theme</button>
    </div>
    </nav>

    <div class="container">
        <h1 data-translate="gpa_title">GPA Calculator</h1>
        <div class="current-mode" data-translate="gpa_description">Расчет средневзвешенного GPA с учетом кредитов</div>

        <div class="formula" data-translate="gpa_formula">
            GPA = Σ(GPA<sub>предмета</sub> × кредиты) / Σ(кредиты)
        </div>

        <div class="input-group">
            <label for="subjects-count" data-translate="subjects_count">Количество предметов:</label>
            <input type="number" id="subjects-count" min="1" max="20" value="6">
        </div>

        <button id="generate-subjects" class="calculate-btn" data-translate="generate_subjects">Сгенерировать форму для предметов</button>

        <div id="subjects-container"></div>

        <button id="calculate-gpa" data-translate="calculate_gpa" class="calculate-btn" style="display: none;">Рассчитать GPA</button>

        <div class="warning-text" data-translate="gpa_warning">
            Важно: Введите корректные данные для всех предметов!
        </div>

        <div id="result" role="status" aria-live="polite" class="result"></div>
    </div>

    <footer>
        <span data-translate="footer_copyright">&copy; 2025 Not_404. In case of any bug contact via Telegram</span>
        <a href="https://t.me/Qrudos" target="_blank" rel="noopener noreferrer">@Qrudos</a>.
    </footer>

    <script src="../js/language.js"></script>
    <script src="../js/localization.js"></script>
    <script src="../js/gpa.js"></script>
</body>

</html>
